[project]
name = "landui-sdk"
version = "0.1.0"
description = "【非官方/第三方】蓝队云 (landui.com) 控制台 SDK —— 云服务器日常运维 / 安全组防火墙"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
gui = ["pyside6>=6.7"]

[project.scripts]
landui = "landui_sdk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["landui_sdk"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "websocket-client>=1.9.2",
]
